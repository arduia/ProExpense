name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - refactor/v2-migration
      - v2-migration
      - cursor/v2-migration-work-6788
      - 'cursor/**'
  pull_request:
    branches:
      - main
      - develop
      - refactor/v2-migration
      - v2-migration
      - cursor/v2-migration-work-6788

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            android-sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-api36-bt36-${{ hashFiles('scripts/setup-android-toolchain.sh', 'gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-api36-bt36-
            android-sdk-${{ runner.os }}-

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android toolchain and download dependencies
        run: bash scripts/setup-android-toolchain.sh

      - name: Build, unit test, and verify Roborazzi
        run: ./gradlew --no-daemon --stacktrace verifyAll

      - name: Upload Roborazzi diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            app/build/outputs/roborazzi/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
