name: Firebase Test Lab

on:
  push:
    branches:
      - main
      - develop
      - refactor/v2-migration
      - v2-migration
      - cursor/v2-migration-work-6788
      - 'cursor/**'
  pull_request:
    branches:
      - main
      - develop
      - refactor/v2-migration
      - v2-migration
      - cursor/v2-migration-work-6788
  workflow_dispatch:

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    if: vars.FIREBASE_TEST_LAB_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            android-sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-api36-bt36-${{ hashFiles('scripts/setup-android-toolchain.sh', 'gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-api36-bt36-
            android-sdk-${{ runner.os }}-

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android toolchain and download dependencies
        run: bash scripts/setup-android-toolchain.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run instrumentation tests on Firebase Test Lab
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TEST_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_RESULTS_BUCKET }}
          FIREBASE_TEST_RESULTS_DIR: firebase-test-lab/${{ github.run_id }}
          CI_COMMIT: ${{ github.sha }}
        run: bash scripts/run-firebase-test-lab.sh
