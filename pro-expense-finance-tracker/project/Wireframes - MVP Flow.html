<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pro Expense — Wireframes · MVP Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-2: #2a2924;
    --muted: #8a8a82;
    --line: #cfcdc2;
    --line-2: #e4e1d6;
    --paper: #f6f3e9;
    --paper-2: #fbf8ee;
    --clay: #c8482a;
    --sans: "Geist", -apple-system, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    --serif: "Instrument Serif", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page { max-width: 1480px; margin: 0 auto; padding: 56px 56px 120px; }

  /* DOC META */
  .doc-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--line); padding-bottom: 16px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .doc-meta .lhs { display: flex; gap: 24px; }
  .doc-meta .lhs span:first-child { color: var(--ink); }
  .doc-meta .pill {
    color: var(--clay); border: 1px solid var(--clay);
    padding: 2px 8px; border-radius: 99px; font-size: 10px; letter-spacing: 0.16em;
  }

  /* HERO */
  .hero { margin-top: 48px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 80px; align-items: end; }
  h1.title {
    font-family: var(--serif); font-weight: 400; font-size: 84px;
    line-height: 0.95; letter-spacing: -0.02em; margin: 0;
  }
  h1.title em { font-style: italic; color: var(--clay); }
  .deck { font-size: 17px; line-height: 1.5; color: var(--ink-2); max-width: 42ch; }
  .deck .lede {
    font-family: var(--serif); font-style: italic; font-size: 22px;
    line-height: 1.35; color: var(--ink); margin: 0 0 16px;
  }

  /* blinking cursor on amount input */
  @keyframes blink { 50% { border-color: transparent; } }

  /* nice scrollbar for the flow strips */
  section ::-webkit-scrollbar { height: 8px; }
  section ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 99px; }
  section ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="wireframe-atoms.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
