<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pro Expense — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto-brand.css">
<style>
  html, body { background: #f3f1ec; }
  a { scroll-margin-top: 64px; }

  @media print {
    @page { size: portrait; margin: 1cm; }

    html, body { background: #f3f1ec !important; }

    *, *::before, *::after {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      /* freeze any entrance animations at their end state */
      animation-delay: -99s !important;
      animation-duration: .001s !important;
      animation-iteration-count: 1 !important;
      animation-fill-mode: both !important;
      animation-play-state: running !important;
      transition-duration: 0s !important;
    }

    /* sticky in-page nav would float on every printed page — pin it static */
    nav { position: static !important; backdrop-filter: none !important; }

    /* each documentation section starts a fresh page */
    section { break-before: page; }

    /* keep cohesive blocks from splitting across page breaks */
    section > div > div { break-inside: avoid; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- live primitives — single source of truth -->
  <script type="text/babel" src="proto-ui.jsx"></script>
  <script type="text/babel" src="proto-phone.jsx"></script>

  <!-- design system docs -->
  <script type="text/babel" src="design-system.jsx"></script>
  <script type="text/babel" src="design-system-a.jsx"></script>
  <script type="text/babel" src="design-system-b.jsx"></script>
  <script type="text/babel" src="design-system-root.jsx"></script>

  <!-- auto-print once React has mounted + fonts are ready -->
  <script type="text/babel">
    (function () {
      function ready() {
        return document.querySelector('#root section') && document.querySelector('#motion');
      }
      function waitForMount(cb, tries) {
        if (ready() || tries <= 0) return cb();
        setTimeout(function () { waitForMount(cb, tries - 1); }, 100);
      }
      window.addEventListener('load', function () {
        waitForMount(function () {
          var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
          fonts.then(function () { setTimeout(function () { window.print(); }, 500); });
        }, 60);
      });
    })();
  </script>
</body>
</html>
