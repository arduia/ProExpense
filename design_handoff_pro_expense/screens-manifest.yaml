# Pro Expense — Screen Manifest
# Every screen, its composable, all UI states, primitives, and sample preview data.
# viewport is 414 x 868 dp for all screens. state -> reference image in reference-images/.
# composable packages: app/ui/ (Home, Onboarding, More) and feature/*/ui/.

defaults:
  viewport: { width: 414, height: 868, unit: dp }
  screenshot_viewport: { width: 427, height: 952, unit: dp, device: Pixel 9 Pro }
  theme: ProExpenseTheme
  bottom_nav: HomeBottomNav  # present on top-level tab screens only

flows:

  - flow_id: flow-01
    name: Quick Log
    screens:
      - screen_id: home
        composable_name: HomeScreen
        package: app/ui/home/HomeScreen.kt
        purpose: Tab root. Month-to-date spend + quick access + recent transactions.
        primitives: [HomeBottomNav, QuickAccessTile, TransactionRow, DayHeader, AmountDisplay(summary)]
        states:
          - { id: empty,  ref: flow-01-home-empty.png,  note: "Fresh user — $0, 'No spending logged yet', empty recent list" }
          - { id: casual, ref: flow-01-home-casual.png, note: "Default persona — spend total, 5 recent rows incl. @tag" }
          - { id: budget, ref: flow-01-home-budget.png, note: "Budget Planner persona — on-track budget summary" }
          - { id: event,  ref: flow-01-home-event.png,  note: "Event Organizer persona — active event surfaced" }
          - { id: quicknote, ref: edge-quicknote.png,   note: "Long-press row → quick note affordance" }
        sample_data:
          spend_month: 80.90
          delta: "-12% from last month"
          recent:
            - { amount: 12.40, category: food, note: "Lunch with M.", time: "12:30 PM" }
            - { amount: 3.50,  category: transport, note: "", time: "09:15 AM" }
            - { amount: 5.00,  category: coffee, note: "Oat latte", time: "08:40 AM" }
            - { amount: 18.00, category: entertainment, note: "Movie · Dune", time: "08:10 PM", tag: "Bali Trip" }
            - { amount: 42.00, category: food, note: "Groceries", time: "05:30 PM" }
      - screen_id: add-amount
        composable_name: AddAmountScreen
        package: feature/logging/ui/AddAmountScreen.kt
        purpose: Step 1 of quick log. Amount-first; keypad auto-opens; category chips.
        primitives: [AmountDisplay, CategoryChip, NumericKeypad]
        states:
          - { id: zero,   ref: flow-01-add-zero.png,   note: "$0 — Next/Save disabled, helper + shake on attempt" }
          - { id: typed,  ref: flow-01-add-amount.png, note: "Amount entered ($12.50), Food selected, actions enabled" }
        sample_data: { amount: "12.50", category: food }
      - screen_id: add-details
        composable_name: AddDetailsScreen
        package: feature/logging/ui/AddDetailsScreen.kt
        purpose: Step 2 — note, date/time, optional @event or debt tag.
        primitives: [CategoryChip, ProTopBar, ProButton, TransactionRow(preview)]
        states:
          - { id: tagged, ref: flow-01-add-details.png, note: "Note + @event tag (Bali Trip)" }
          - { id: note-cap, ref: edge-note.png,         note: "Note at 200-char cap" }
          - { id: tag-exclusive, ref: edge-tag.png,     note: "Event vs debt @tag mutual exclusion" }
          - { id: draft-restore, ref: edge-draft.png,   note: "Draft restored after force-close mid-entry" }
        sample_data: { amount: "12.50", category: food, note: "Lunch with M.", date: "Today, May 25", time: "12:30 PM", tag: "Bali Trip" }

  - flow_id: flow-02
    name: Browse Journal
    screens:
      - screen_id: journal
        composable_name: JournalScreen
        package: feature/journal/ui/JournalScreen.kt
        purpose: Tab root. Date-grouped, searchable, filterable transaction history.
        primitives: [HomeBottomNav, SearchField, FilterChip, DayHeader, TransactionRow]
        states:
          - { id: list,       ref: flow-02-journal-list.png, note: "Date-grouped list with running day totals" }
          - { id: no-results, ref: edge-search.png,          note: "Search with zero matches — empty message" }
        sample_data: { filters: [All, Food, Transport, Bills, More] }
      - screen_id: journal-detail
        composable_name: JournalDetailScreen
        package: feature/journal/ui/JournalDetailScreen.kt
        purpose: Single transaction detail; linked event surfaced; edit/delete.
        primitives: [ProTopBar, LogCategoryBadge, AmountDisplay, ProButton, BottomSheet(actions)]
        states:
          - { id: linked,  ref: flow-02-journal-detail.png,  note: "Detail linked to an Event" }
          - { id: actions, ref: flow-02-journal-actions.png, note: "Edit / delete action sheet" }
        sample_data: { amount: 18.00, category: entertainment, note: "Movie · Dune", tag: "Bali Trip" }

  - flow_id: flow-03
    name: More
    screens:
      - screen_id: more-hub
        composable_name: MoreHubScreen
        package: app/ui/more/MoreHubScreen.kt
        purpose: Tab root. Settings + feature entry points (reports, categories, currency, data).
        primitives: [HomeBottomNav, ProTopBar, list rows]
        states: [{ id: default, ref: flow-03-more-hub.png }]
      - screen_id: reports
        composable_name: ReportsScreen
        package: feature/reports/ui/ReportsScreen.kt
        purpose: Monthly spend breakdown by category.
        primitives: [ProTopBar, LogCategoryBadge, bar/figures]
        states:
          - { id: monthly,       ref: flow-03-reports.png,    note: "Category breakdown, monthly" }
          - { id: uncategorized, ref: edge-reports-unc.png,   note: "All spend uncategorized — fallback" }
      - screen_id: categories
        composable_name: CategoryListScreen
        package: feature/categories/ui/CategoryListScreen.kt
        purpose: Manage categories (defaults + custom add).
        primitives: [ProTopBar, LogCategoryBadge, CategoryChip, ProButton]
        states:
          - { id: list,      ref: flow-03-categories.png, note: "Default + custom categories" }
          - { id: duplicate, ref: edge-cat-dup.png,       note: "Duplicate category name error" }
      - screen_id: more-currency
        composable_name: CurrencySettingScreen
        package: feature/currency/ui/CurrencySettingScreen.kt
        purpose: Change home currency.
        primitives: [ProTopBar, BottomSheet(picker)]
        states: [{ id: default, ref: flow-03-more-currency.png }]
      - screen_id: more-export
        composable_name: DataExportScreen
        package: feature/data/ui/DataExportScreen.kt
        purpose: Export data (CSV).
        primitives: [ProTopBar, ProButton]
        states: [{ id: default, ref: flow-03-more-export.png }]
      - screen_id: more-clear
        composable_name: ClearDataScreen
        package: feature/data/ui/ClearDataScreen.kt
        purpose: Destructive clear-all-data confirmation.
        primitives: [ProTopBar, ProButton(danger)]
        states: [{ id: default, ref: flow-03-more-clear.png }]

  - flow_id: flow-04
    name: First Launch (Splash, Onboarding, Profile Setup)
    screens:
      - screen_id: splash
        composable_name: SplashScreen
        package: app/ui/SplashScreen.kt
        purpose: Brand splash on cold start.
        primitives: [brand mark]
        states: [{ id: default, ref: flow-04-splash.png }]
      - screen_id: onboarding
        composable_name: OnboardingScreen
        package: app/ui/onboarding/OnboardingScreen.kt
        purpose: 5-slide value intro; ends in 'Get started'.
        primitives: [pager, illustration, ProButton]
        states:
          - { id: welcome,      ref: flow-04-onb-1.png }
          - { id: quick-log,    ref: flow-04-onb-2.png }
          - { id: shared-costs, ref: flow-04-onb-3.png }
          - { id: event-budget, ref: flow-04-onb-4.png }
          - { id: get-started,  ref: flow-04-onb-5.png }
      - screen_id: profile-name
        composable_name: ProfileNameScreen
        package: app/ui/onboarding/ProfileNameScreen.kt
        purpose: Capture display name (account-free, local only).
        primitives: [ProTopBar, text field, ProButton]
        states: [{ id: default, ref: flow-04-prof-name.png }]
      - screen_id: profile-currency
        composable_name: ProfileCurrencyScreen
        package: feature/currency/ui/ProfileCurrencyScreen.kt
        purpose: Pick home currency during setup.
        primitives: [ProButton, BottomSheet(picker)]
        states:
          - { id: default, ref: flow-04-prof-currency.png }
          - { id: picker,  ref: flow-04-prof-currency-sheet.png, note: "Currency picker sheet" }

  - flow_id: flow-05
    name: PIN Auth
    screens:
      - screen_id: pin-setup
        composable_name: PinSetupScreen
        package: feature/auth/ui/PinSetupScreen.kt
        purpose: Create a 6-digit PIN + required security question.
        primitives: [PinKeypad, ProButton]
        states:
          - { id: setup,    ref: flow-05-pin-setup.png }
          - { id: security, ref: flow-05-pin-security.png, note: "Required security question" }
          - { id: mismatch, ref: edge-pin-mismatch.png,    note: "Confirm PIN mismatch" }
      - screen_id: pin-entry
        composable_name: PinEntryScreen
        package: feature/auth/ui/PinEntryScreen.kt
        purpose: Unlock with PIN or biometric; lockout after 5 fails.
        primitives: [PinKeypad, icon-fingerprint]
        states:
          - { id: entry,    ref: flow-05-pin-entry.png,  note: "4 of 6 digits entered" }
          - { id: lockout,  ref: flow-05-pin-lock.png,   note: "Locked 30s, countdown, keypad disabled" }
          - { id: wrong,    ref: edge-pin-wrong.png,     note: "Incorrect PIN — dots shake" }
          - { id: recovery, ref: edge-pin-recovery.png,  note: "Forgot PIN → security-question recovery" }

  - flow_id: flow-06
    name: Event Budget
    screens:
      - screen_id: event-list
        composable_name: EventListScreen
        package: feature/events/ui/EventListScreen.kt
        purpose: Event budgets overview.
        primitives: [ProTopBar, cards, progress, ProButton]
        states:
          - { id: empty,     ref: flow-06-event-empty.png, note: "No events yet" }
          - { id: active,    ref: flow-06-event-list.png,  note: "3 active, 1 over budget" }
          - { id: over-warn, ref: edge-event-warn.png,     note: "Over budget (105%) warning" }
      - screen_id: event-create
        composable_name: EventCreateScreen
        package: feature/events/ui/EventCreateScreen.kt
        purpose: Create an event budget (name, range, amount).
        primitives: [ProTopBar, text fields, AmountDisplay, ProButton]
        states:
          - { id: filled, ref: flow-06-event-create.png }
          - { id: errors, ref: edge-event-errors.png, note: "$0 amount + duplicate name" }
      - screen_id: event-detail
        composable_name: EventDetailScreen
        package: feature/events/ui/EventDetailScreen.kt
        purpose: One event — spend vs budget + linked transactions.
        primitives: [ProTopBar, progress, TransactionRow]
        states:
          - { id: active, ref: flow-06-event-detail.png, note: "Bali Trip" }
          - { id: closed, ref: edge-event-closed.png,     note: "Closed event — read-only" }

  - flow_id: flow-07
    name: Debt & Lending
    screens:
      - screen_id: debt-tracker
        composable_name: DebtTrackerScreen
        package: feature/debt/ui/DebtTrackerScreen.kt
        purpose: Lent / Owe ledger with segmented toggle.
        primitives: [ProTopBar, segmented toggle, list rows, ProButton]
        states:
          - { id: lent,     ref: flow-07-debt-lent.png }
          - { id: owe,      ref: flow-07-debt-owe.png }
          - { id: conflict, ref: edge-debt-conflict.png, note: "Opposite-side record warning" }
      - screen_id: debt-add
        composable_name: DebtAddScreen
        package: feature/debt/ui/DebtAddScreen.kt
        purpose: Add a debt record (person, amount, due).
        primitives: [BottomSheet, text fields, AmountDisplay, ProButton]
        states: [{ id: default, ref: flow-07-debt-add.png }]
      - screen_id: debt-detail
        composable_name: DebtDetailScreen
        package: feature/debt/ui/DebtDetailScreen.kt
        purpose: One debt — amount, status, mark settled.
        primitives: [ProTopBar, AmountDisplay, ProButton(secondary + success)]
        states:
          - { id: lent,    ref: flow-07-debt-lent-detail.png, note: "Lent · John" }
          - { id: owe,     ref: flow-07-debt-owe-detail.png,  note: "Owe · David" }
          - { id: settled, ref: edge-debt-settled.png,        note: "Delete settled record" }

  - flow_id: flow-08
    name: Shared Costs (Split a Bill)
    screens:
      - screen_id: shared-input
        composable_name: SharedCostsScreen
        package: feature/shared/ui/SharedCostsScreen.kt
        purpose: Split a bill equally or custom among up to 20 people.
        primitives: [ProTopBar, AmountDisplay, people stepper, ProButton]
        states:
          - { id: equal,  ref: flow-08-shared-input.png }
          - { id: zero,   ref: edge-shared-zero.png,   note: "$0 total guard" }
          - { id: limits, ref: edge-shared-limits.png, note: "Max 20 people + custom split" }
      - screen_id: shared-summary
        composable_name: SharedSummaryScreen
        package: feature/shared/ui/SharedSummaryScreen.kt
        purpose: Per-person split result.
        primitives: [ProTopBar, list rows, ProButton]
        states: [{ id: default, ref: flow-08-shared-summary.png }]
      - screen_id: shared-history
        composable_name: SharedHistoryScreen
        package: feature/shared/ui/SharedHistoryScreen.kt
        purpose: Past splits.
        primitives: [ProTopBar, list rows]
        states: [{ id: default, ref: flow-08-shared-history.png }]
